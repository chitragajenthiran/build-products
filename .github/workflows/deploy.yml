name: Deploy Microservices to EC2

on:
  push:
    branches:
      - main
      - Feature/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Create ECR repositories if not exist
        run: |
          SERVICES=("eureka-service-registry" "taco-order-app" "taco-account-app")

          for SERVICE in "${SERVICES[@]}"; do
            REPO_CHECK=$(aws ecr describe-repositories --repository-names $SERVICE 2>&1 || true)

            if echo "$REPO_CHECK" | grep -q "RepositoryNotFoundException"; then
              echo "ECR repo $SERVICE not found. Creating..."
              aws ecr create-repository --repository-name $SERVICE
            else
              echo "ECR repo $SERVICE already exists."
            fi
          done

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./microservices/docker-compose.yml"
          target: "/home/ec2-user/app/"

      - name: Build & Push Images
        run: |
          SERVICES=("eureka-service-registry" "taco-account-app" "taco-order-app")

          for SERVICE in "${SERVICES[@]}"; do
            echo "Building $SERVICE"
            IMAGE="${{ steps.login-ecr.outputs.registry }}/${SERVICE}:latest"

            docker build -t $IMAGE ./microservices/$SERVICE
            docker push $IMAGE
          done

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker + Git
            sudo yum update -y
            sudo yum install -y docker git

            # Start Docker
            sudo systemctl start docker
            sudo usermod -aG docker ec2-user

            # Install Docker Compose if missing
            if ! command -v docker-compose &> /dev/null
            then
              sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Login to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # Prepare app folder
            mkdir -p /home/ec2-user/app

      - name: Upload docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./microservices/docker-compose.yml"
          target: "/home/ec2-user/app"

      - name: Start Services on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app/microservices
            docker-compose pull
            docker-compose down
            docker-compose up -d